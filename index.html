<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="按算法专题浏览 ICPC 练习题。">
  <meta name="theme-color" content="#4285F4">
  <title>VectorLi · ICPC 题单</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./algorithm-syllabus.js"></script>
  <script defer src="./algorithm-problems.js"></script>
  <script defer src="./syllabus.js"></script>
  <script defer src="./extra-source-problems.js"></script>
  <script defer src="./source-problems.js"></script>
  <script defer src="./math-problems.js"></script>
  <script defer src="./problems.js"></script>
  <script defer src="./engine.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#results">跳到题目列表</a>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="./"><span class="brand-mark">V</span><span>VectorLi<small>ICPC 题单</small></span></a>
      <h2 class="topic-head">专题</h2>
      <nav id="topicNav" class="topic-nav" aria-label="按专题筛选"></nav>
      <div class="sidebar-footer">专题浏览 · 完成状态保存在本机</div>
    </aside>
    <main class="main-wrap">
      <header class="topbar"><h1>ICPC 题单</h1></header>
      <section class="workspace" aria-labelledby="listTitle">
        <div class="workspace-header"><div class="list-heading"><h2 id="listTitle">全部题目</h2><span id="resultCount" class="count-pill" role="status" aria-live="polite"></span><span id="completionSummary" class="completion-summary" role="status" aria-live="polite"></span></div></div>
        <div id="results" class="table-wrap" tabindex="-1">
          <table><caption class="sr-only">题目、专题、来源和独立估算难度</caption><thead><tr><th class="completion-cell" scope="col">完成</th><th class="number-cell" scope="col">#</th><th scope="col">题目 · 专题</th><th scope="col">来源</th><th class="difficulty-cell" scope="col">估算 CF</th></tr></thead><tbody id="problemRows"></tbody></table>
          <div id="emptyState" class="empty-state" hidden><h3>这个专题还没有题目。</h3></div>
        </div>
        <div class="table-footer"><span id="footerCount"></span></div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><div class="noscript">请启用 JavaScript 以查看题目。</div></noscript>
</body>
</html>
